[project]
name = "sublimesecurity"
version = "1.1.0"
description = "Integrates with the Sublime Security Platform API to perform email security operations including binexplode analysis, link analysis, audit log management, hunt jobs, list management, message group actions, message analysis, rule management, SCIM user provisioning, and more"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<3.16"
authors = [
    { name = "Splunk SOAR Community" }
]
dependencies = [
    "splunk-soar-sdk>=7.1.3",
    "requests>=2.31.0",
]

# uv sync / uv run install the "dev" group by default (CI runs
# `uv run python -m pytest` without --extra).
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
]

# SOAR platform validates main_module as a dotted module path (src.app:app).
# Without this override the SDK defaults to src/app.py:app, which fails upload.
[tool.soar.app]
main_module = "src.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# SOAR runs on Linux; constrain resolution so Windows-only transitive
# deps (e.g. win-unicode-console via oletools) are excluded from the lock.
[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- Pre-commit / linter settings (from the previously validated connector) ---

[tool.ruff]
line-length = 145
target-version = "py39"

[tool.ruff.lint]
select = [ # Auto-fixable rules only
    "I",    # isort
    "UP",   # pyupgrade
    "F401", # unused imports
    "RUF"   # ruff rules
]
ignore = [
    "RUF012", # Not auto-fixable (remove eventually)
    "RUF001" # Not auto-fixable (remove eventually)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "UP035"]  # __init__.py file exceptions

[tool.ruff.lint.mccabe]
max-complexity = 28

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.djlint]
profile = "django"
extension = "html"
indent = 2
include = "H008,H009,H010,H014,H024,H026,H033,T028,T034"
ignore = "D004,D018,H005,H006,H007,H011,H012,H013,H015,H016,H017,H019,H020,H021,H022,H023,H025,H029,H030,H031,H035,H036,H037,J004,J018,T001,T002,T003,T027,T032"

[tool.mdformat]
wrap = true
number = true

[tool.semgrep]
config = [
    "p/python",
    "semgrep",
    "r/typescript.react.security.audit.react-dangerouslysetinnerhtml.react-dangerouslysetinnerhtml"
]
ignore-patterns = [
    "node_modules/",
    "build/",
    "dist/",
    "vendor/",
    "env/",
    ".env/",
    "venv/",
    ".venv/",
    ".tox/",
    "*.min.js",
    "test/",
    "tests/",
    "*_test.go",
    ".semgrep",
    "wheels/",
    ".html",
    "*.md",
    "*.svg"
]
